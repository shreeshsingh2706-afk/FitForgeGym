# ============================================
# Nginx Configuration for FitForge on AWS EC2
# File location: /etc/nginx/sites-available/fitforge
# ============================================

server {
    listen 80;
    server_name your-aws-domain.com;   # ← Replace with your EC2 IP or domain

    # ── Serve React Frontend ──────────────────────────────────────────────
    # React build files live at /var/www/fitforge
    root /var/www/fitforge;
    index index.html;

    # For React Router: always serve index.html for unknown routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy API calls to Spring Boot ───────────────────────────────────
    # Any request to /api/* gets forwarded to Spring Boot on port 8080
    location /api/ {
        proxy_pass http://localhost:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers (if needed)
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
    }

    # ── Static file caching (performance) ────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
