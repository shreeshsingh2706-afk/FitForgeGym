# ============================================
# FitForge Backend - Application Configuration
# ============================================

# Server port — Railway/Render inject PORT automatically
server.port=${PORT:8080}

# ---- MySQL Database Configuration ----
# In production: set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# as environment variables on Railway/Render. Falls back to local dev values.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fitforge_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fitforge_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fitforge_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate Settings ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- CORS ----
# Set CORS_ALLOWED_ORIGINS on Railway/Render to your Vercel URL
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
