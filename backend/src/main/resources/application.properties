# ============================================
# FitForge Backend - Application Configuration
# ============================================

# Server port (default: 8080)
server.port=8080

# ---- MySQL Database Configuration ----
spring.datasource.url=jdbc:mysql://localhost:3306/fitforge_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=fitforge_user
spring.datasource.password=fitforge_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate Settings ----
# 'update' = auto-create/update tables based on your Java models
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- CORS ----
# Allow React frontend (port 3000 in dev, or your domain in prod)
cors.allowed-origins=http://localhost:3000,http://your-aws-domain.com
