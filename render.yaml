# ============================================
# Render.com Blueprint — FitForge Full Stack
# Deploys: Spring Boot Backend + React Frontend
# Database: MySQL (managed separately on Render)
# ============================================

services:
  # ── Spring Boot Backend ─────────────────────
  - type: web
    name: fitforge-backend
    runtime: java
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/fitforge-backend-1.0.0.jar
    healthCheckPath: /api/hello
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false          # You will paste this from Render MySQL dashboard
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # Set to your frontend Render URL after deploying frontend

  # ── React Frontend ───────────────────────────
  - type: web
    name: fitforge-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /api/*
        destination: https://fitforge-backend.onrender.com/api/*   # Update with your backend URL
      - type: rewrite
        source: /*
        destination: /index.html
